# Production: live_paper on Starter web + Starter worker + Basic Postgres.
# Set ODDS_API_KEY on both services in the dashboard (sync: false).
services:
  - type: web
    name: hyperion-web
    runtime: python
    region: ohio
    plan: starter
    healthCheckPath: /api/health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gthread --threads 8 -w 1 -b 0.0.0.0:$PORT src.api:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hyperion-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: TRADING_MODE
        value: live_paper
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EMBED_DAEMON
        value: "false"
      - key: FEE_PERCENTAGE
        value: "0.02"
      - key: PAPER_GAMES_PER_CYCLE
        value: "20"
      - key: SCAN_INTERVAL_SECONDS
        value: "900"
      - key: API_URL
        value: "https://hyperion-web-dbbz.onrender.com"
      - key: LIVE_SPORTS
        value: upcoming
      - key: MAX_BETS_PER_CYCLE
        value: "10"
      - key: ODDS_API_KEY
        sync: false

  - type: worker
    name: hyperion-daemon
    runtime: python
    region: ohio
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/daemon.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hyperion-db
          property: connectionString
      - key: API_URL
        fromService:
          type: web
          name: hyperion-web
          property: hostport
      - key: TRADING_MODE
        value: live_paper
      - key: MAX_BETS_PER_CYCLE
        value: "10"
      - key: LIVE_SPORTS
        value: upcoming
      - key: SCAN_INTERVAL_SECONDS
        value: "900"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FEE_PERCENTAGE
        value: "0.02"
      - key: ODDS_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false

databases:
  - name: hyperion-db
    plan: basic_256mb
    region: ohio
    postgresMajorVersion: 16
